<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkAtlas — Remote AI & Data Jobs</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">W</div>
        <span class="font-bold text-lg tracking-tight">WorkAtlas</span>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full">
        Live ATS Sync
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-5 space-y-5">

    <!-- Ad Banner Slot (Top) -->
    <div id="ad-top" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-400">
      Sponsored Ad Space (Insert AdSense / AdMob Banner Code Here)
    </div>

    <!-- Search & Category Filters -->
    <div class="space-y-3">
      <input
        id="searchInput"
        type="text"
        placeholder="Search AI training, voice, annotation, company..."
        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"
      />

      <div class="flex flex-wrap gap-2" id="filterButtons">
        <button data-cat="All" class="cat-btn bg-blue-600 text-white text-xs font-medium px-3.5 py-2 rounded-lg">All Jobs</button>
        <button data-cat="Data & AI Training" class="cat-btn bg-slate-800 text-slate-300 text-xs font-medium px-3.5 py-2 rounded-lg">Data & AI Training</button>
        <button data-cat="Audio & Voice" class="cat-btn bg-slate-800 text-slate-300 text-xs font-medium px-3.5 py-2 rounded-lg">Audio & Voice</button>
        <button data-cat="Saved" class="cat-btn bg-slate-800 text-slate-300 text-xs font-medium px-3.5 py-2 rounded-lg">Saved (<span id="savedCount">0</span>)</button>
      </div>
    </div>

    <!-- Job Counter -->
    <div class="flex items-center justify-between text-xs text-slate-400">
      <span id="jobStatus">Syncing live job boards...</span>
      <span id="jobTotal">0 listings</span>
    </div>

    <!-- Job Cards Grid -->
    <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <!-- Bottom Ad Banner Slot -->
  <footer class="max-w-5xl w-full mx-auto px-4 py-6 space-y-4">
    <div id="ad-bottom" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-400">
      Sponsored Ad Space (Insert Bottom Banner Code Here)
    </div>
    <p class="text-center text-xs text-slate-500">WorkAtlas — Zero-Login Remote AI Job Aggregator</p>
  </footer>

  <script>
    // Public Greenhouse ATS boards to auto-fetch remote AI & data jobs
    const ATS_BOARDS = [
      { name: "Scale AI", slug: "scaleai" },
      { name: "Invisible Technologies", slug: "invisibletechnologies" },
      { name: "Toloka", slug: "toloka" }
    ];

    let allJobs = [];
    let activeCategory = "All";
    let savedIds = JSON.parse(localStorage.getItem("workatlas_saved") || "[]");

    const jobGrid = document.getElementById("jobGrid");
    const searchInput = document.getElementById("searchInput");
    const jobStatus = document.getElementById("jobStatus");
    const jobTotal = document.getElementById("jobTotal");
    const savedCount = document.getElementById("savedCount");

    function updateSavedCounter() {
      savedCount.textContent = savedIds.length;
    }

    function toggleSave(id) {
      if (savedIds.includes(id)) {
        savedIds = savedIds.filter(item => item !== id);
      } else {
        savedIds.push(id);
      }
      localStorage.setItem("workatlas_saved", JSON.stringify(savedIds));
      updateSavedCounter();
      renderJobs();
    }

    async function loadReferrals() {
      try {
        const res = await fetch("./referrals.json");
        if (!res.ok) return [];
        return await res.json();
      } catch {
        return [];
      }
    }

    async function loadATSJobs() {
      const results = [];
      for (const board of ATS_BOARDS) {
        try {
          const res = await fetch(`https://greenhouse.io{board.slug}/jobs`);
          if (!res.ok) continue;
          const data = await res.json();
          const filtered = (data.jobs || [])
            .filter(j => /remote|data|ai|annotat|train|audio|voice|evaluat|linguist/i.test(j.title + " " + (j.location?.name || "")))
            .slice(0, 15)
            .map(j => ({
              id: `gh-${board.slug}-${j.id}`,
              company: board.name,
              title: j.title,
              category: /audio|voice|speech|linguist/i.test(j.title) ? "Audio & Voice" : "Data & AI Training",
              pay: "Competitive / Remote",
              location: j.location?.name || "Remote",
              url: j.absolute_url,
              featured: false
            }));
          results.push(...filtered);
        } catch (e) {
          console.warn("Skipped board:", board.name);
        }
      }
      return results;
    }

    function renderJobs() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = allJobs.filter(job => {
        const matchesCat =
          activeCategory === "All" ? true :
          activeCategory === "Saved" ? savedIds.includes(job.id) :
          job.category === activeCategory;

        const matchesSearch =
          !query ||
          job.title.toLowerCase().includes(query) ||
          job.company.toLowerCase().includes(query) ||
          job.location.toLowerCase().includes(query);

        return matchesCat && matchesSearch;
      });

      jobTotal.textContent = `${filtered.length} listings`;

      if (filtered.length === 0) {
        jobGrid.innerHTML = `<div class="col-span-full text-center py-10 text-sm text-slate-400">No matching jobs found. Try clearing your search or switching tabs.</div>`;
        return;
      }

      jobGrid.innerHTML = filtered.map(job => {
        const isSaved = savedIds.includes(job.id);
        return `
          <div class="bg-slate-900 border ${job.featured ? 'border-blue-500/50' : 'border-slate-800'} rounded-2xl p-4 flex flex-col justify-between gap-4">
            <div class="space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-semibold text-blue-400 truncate">${job.company}</span>
                ${job.featured ? '<span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full shrink-0">Featured</span>' : ''}
              </div>
              <h3 class="font-semibold text-sm text-white leading-snug line-clamp-2">${job.title}</h3>
              <div class="text-xs text-slate-400 space-y-1">
                <p>Pay: <span class="text-slate-200">${job.pay}</span></p>
                <p class="truncate">Location: ${job.location}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 pt-2 border-t border-slate-800/80">
              <a href="${job.url}" target="_blank" rel="noopener noreferrer"
                 class="flex-1 text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition">
                Apply Now
              </a>
              <button onclick="toggleSave('${job.id}')"
                class="px-3 py-2.5 rounded-xl text-xs font-medium border ${isSaved ? 'bg-amber-500/20 border-amber-500/40 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-300'}">
                ${isSaved ? 'Saved' : 'Save'}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => {
          b.classList.remove("bg-blue-600", "text-white");
          b.classList.add("bg-slate-800", "text-slate-300");
        });
        btn.classList.add("bg-blue-600", "text-white");
        btn.classList.remove("bg-slate-800", "text-slate-300");
        activeCategory = btn.dataset.cat;
        renderJobs();
      });
    });

    searchInput.addEventListener("input", renderJobs);

    async function init() {
      updateSavedCounter();
      const [referrals, atsJobs] = await Promise.all([loadReferrals(), loadATSJobs()]);
      allJobs = [...referrals, ...atsJobs];
      jobStatus.textContent = "Updated live from ATS & partner feeds";
      renderJobs();
    }

    init();
  </script>
</body>
</html>

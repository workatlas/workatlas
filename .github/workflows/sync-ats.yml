name: Auto-Sync Public ATS Jobs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Live ATS Jobs and AI News
        run: |
          node -e '
          const fs = require("fs");
          const existing = JSON.parse(fs.readFileSync("ats-jobs.json", "utf8"));
          const getCat = (t) => /audio|voice|speech|linguist|transcri|support|writer/i.test(t) ? "Audio & Voice" : "Data & AI Training";

          async function run() {
            let live = [];
            try {
              const r = await fetch("https://arbeitnow.com");
              if (r.ok) {
                const d = await r.json();
                live = (d.data || []).slice(0, 50).map(j => ({
                  id: "arb-" + j.slug,
                  company: j.company_name,
                  title: j.title,
                  category: getCat(j.title),
                  pay: j.remote ? "Remote / Competitive" : "Competitive",
                  location: j.remote ? "Remote (" + j.location + ")" : j.location,
                  url: j.url,
                  featured: false
                }));
              }
            } catch (e) {}

            const seen = new Set();
            const merged = [...existing, ...live].filter(x => !seen.has(x.id) && seen.add(x.id));
            fs.writeFileSync("ats-jobs.json", JSON.stringify(merged, null, 2));

            try {
              const nr = await fetch("https://algolia.com");
              if (nr.ok) {
                const nd = await nr.json();
                const news = (nd.hits || []).map(h => ({
                  title: h.title,
                  url: h.url || "https://ycombinator.com" + h.objectID,
                  date: h.created_at
                }));
                if (news.length) fs.writeFileSync("ai-news.json", JSON.stringify(news, null, 2));
              }
            } catch (e) {}
          }
          run();
          '

      - name: Commit Updated Jobs and News
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ATS jobs" && git push)

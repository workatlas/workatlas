name: Auto-Sync Public ATS Jobs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Live ATS Feeds
        run: |
          node -e '
          const fs = require("fs");

          const GH_BOARDS = [
            { name: "Scale AI", slug: "scaleai" },
            { name: "Invisible Technologies", slug: "invisibletechnologies" },
            { name: "Toloka", slug: "toloka" },
            { name: "Labelbox", slug: "labelbox" },
            { name: "Runway", slug: "runwayml" },
            { name: "Snorkel AI", slug: "snorkelai" }
          ];

          const LEVER_BOARDS = [
            { name: "Mistral AI", slug: "mistral" },
            { name: "Cohere", slug: "cohere" }
          ];

          const ASHBY_BOARDS = [
            { name: "Perplexity AI", slug: "perplexity" },
            { name: "Hugging Face", slug: "huggingface" }
          ];

          const getCat = (txt) => /audio|voice|speech|linguist|transcri|support|writer|content|community/i.test(txt)
            ? "Audio & Voice"
            : "Data & AI Training";

          async function run() {
            let jobs = [];

            for (const b of GH_BOARDS) {
              try {
                const r = await fetch(`https://greenhouse.io{b.slug}/jobs`);
                if (!r.ok) continue;
                const d = await r.json();
                const items = (d.jobs || []).slice(0, 15).map(j => ({
                  id: `gh-${b.slug}-${j.id}`,
                  company: b.name,
                  title: j.title,
                  category: getCat(j.title),
                  pay: "Competitive / Global",
                  location: j.location?.name || "Remote / Global",
                  url: j.absolute_url,
                  featured: false
                }));
                console.log(b.name, items.length);
                jobs.push(...items);
              } catch (e) {}
            }

            for (const b of LEVER_BOARDS) {
              try {
                const r = await fetch(`https://lever.co{b.slug}?mode=json`);
                if (!r.ok) continue;
                const d = await r.json();
                const items = (d || []).slice(0, 15).map(j => ({
                  id: `lv-${b.slug}-${j.id}`,
                  company: b.name,
                  title: j.text,
                  category: getCat(j.text),
                  pay: "Competitive / Global",
                  location: j.categories?.location || "Remote / Global",
                  url: j.hostedUrl,
                  featured: false
                }));
                console.log(b.name, items.length);
                jobs.push(...items);
              } catch (e) {}
            }

            for (const b of ASHBY_BOARDS) {
              try {
                const r = await fetch(`https://ashbyhq.com{b.slug}`);
                if (!r.ok) continue;
                const d = await r.json();
                const items = (d.jobs || []).slice(0, 15).map(j => ({
                  id: `ash-${b.slug}-${j.id}`,
                  company: b.name,
                  title: j.title,
                  category: getCat(j.title),
                  pay: "Competitive / Global",
                  location: j.location || "Remote / Global",
                  url: j.jobUrl,
                  featured: false
                }));
                console.log(b.name, items.length);
                jobs.push(...items);
              } catch (e) {}
            }

            fs.writeFileSync("ats-jobs.json", JSON.stringify(jobs, null, 2));
            console.log("TOTAL SAVED:", jobs.length);
          }
          run();
          '

      - name: Commit Updated Job List
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add ats-jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ATS jobs" && git push)
